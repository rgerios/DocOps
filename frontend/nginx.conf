server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # arquivos com hash no nome: cache longo
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    # o Explorer (viewer) e o index sempre revalidados
    location /viewer/ { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
